<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zyro — Mono + Orange</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#0a0a0a;
  --bg-2:#111111;
  --ink:#f2f2f2;
  --ink-2:#c8c8c8;
  --dim:#8a8a8a;
  --dim-2:#5a5a5a;
  --box:rgba(255,255,255,.035);
  --box-2:rgba(255,255,255,.06);
  --line:rgba(255,255,255,.08);
  --line-2:rgba(255,255,255,.16);
  --code:rgba(0,0,0,.55);
  --glow-soft:rgba(255,255,255,.10);
  --glow-faint:rgba(255,255,255,.045);
  --focus:rgba(255,255,255,.35);
  --focus-glow:rgba(255,255,255,.18);
  --caret:#f2f2f2;
  --caret-glow:rgba(255,255,255,.85);
  /* orange accent — used ONLY for the loading animation */
  --acc:#d97757;
  --acc-2:#f0b48a;
  --acc-3:#c9623f;
  --acc-glow:rgba(217,119,87,.55);
}
*{box-sizing:border-box}
html{height:100%}
body{
  margin:0;height:100vh;height:100dvh;overflow:hidden;
  background:var(--bg);color:var(--ink);
  font:15.5px/1.65 'Space Grotesk',system-ui,sans-serif;
  display:flex;flex-direction:column;position:relative;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;top:-320px;left:50%;transform:translateX(-50%);
  width:720px;height:720px;border-radius:50%;
  background:radial-gradient(circle,var(--glow-soft),transparent 62%);
  filter:blur(70px);pointer-events:none;z-index:0;
}
body::after{
  content:"";position:fixed;bottom:-260px;right:-160px;
  width:540px;height:540px;border-radius:50%;
  background:radial-gradient(circle,var(--glow-faint),transparent 65%);
  filter:blur(70px);pointer-events:none;z-index:0;
}
.blob-3{
  position:fixed;top:34%;left:-200px;
  width:440px;height:440px;border-radius:50%;
  background:radial-gradient(circle,var(--glow-faint),transparent 65%);
  filter:blur(80px);pointer-events:none;z-index:0;
}

header{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 18px;position:relative;z-index:2;
}
.icon{
  background:var(--box);border:1px solid var(--line);
  width:38px;height:38px;border-radius:11px;color:var(--dim);
  display:grid;place-items:center;cursor:pointer;
  backdrop-filter:blur(12px);
  transition:background .2s,color .2s,border-color .2s;
}
.icon:hover{background:var(--box-2);color:var(--ink);border-color:var(--line-2)}
.hgroup{display:flex;gap:7px;align-items:center}

main{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  display:flex;flex-direction:column;position:relative;z-index:2;
}
.wrap{
  width:100%;max-width:720px;margin:0 auto;padding:0 18px;flex:1;
  display:flex;flex-direction:column;
}

.hero{margin:auto 0;padding:6vh 0;text-align:center}
.hero h1{
  font:500 clamp(34px,9vw,54px)/1.12 'Space Grotesk',sans-serif;
  margin:0;letter-spacing:-1.8px;
  background:linear-gradient(180deg,#ffffff 0%,#8a8a8a 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:28px}
.chips button{
  border:1px solid var(--line);background:var(--box);
  border-radius:999px;padding:9px 16px;font-size:14px;color:var(--ink-2);
  backdrop-filter:blur(12px);cursor:pointer;
  transition:background .2s,border-color .2s,color .2s,transform .15s;
}
.chips button:hover{
  background:var(--box-2);
  border-color:var(--line-2);
  color:var(--ink);
  transform:translateY(-1px);
}

#log{padding-bottom:24px;display:none}
#log.show{display:block}

.u{margin:22px 0 10px;display:flex;justify-content:flex-end}
.u>div{
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.14);
  padding:11px 17px;
  border-radius:18px 18px 5px 18px;
  max-width:82%;
  white-space:pre-wrap;word-break:break-word;
  backdrop-filter:blur(14px);
  color:#ffffff;
}

.a{margin:14px 0 18px}

/* ====== loading chip — orange accent ====== */
.ai-chip{
  display:inline-flex;align-items:center;gap:10px;
  padding:7px 14px;border:1px solid var(--line);
  border-radius:999px;background:var(--box);
  color:var(--dim);font-size:12.5px;margin-bottom:14px;
  backdrop-filter:blur(12px);
  transition:opacity .5s,border-color .3s,background .3s;
}
.ai-chip.done{
  border-color:rgba(217,119,87,.4);
  background:rgba(217,119,87,.08);
}
.ai-chip.fade-out{opacity:0}
.check{color:var(--acc);font-weight:700;font-size:13px}
.done-text{color:var(--ink)}
.spark{
  width:15px;height:15px;flex:none;
  animation:sparkPulse 1.6s ease-in-out infinite;
  filter:drop-shadow(0 0 8px var(--acc-glow));
}
.spark svg{width:100%;height:100%;display:block;animation:sparkSpin 2.6s linear infinite}
@keyframes sparkSpin{to{transform:rotate(1turn)}}
@keyframes sparkPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
.shimmer{
  font-weight:500;color:transparent;
  -webkit-background-clip:text;background-clip:text;
  background-image:linear-gradient(90deg,
    var(--dim-2) 0%,
    var(--ink) 40%,
    var(--acc) 50%,
    var(--ink) 60%,
    var(--dim-2) 100%);
  background-size:220% 100%;
  animation:shimmer 1.6s linear infinite;
  transition:opacity .17s;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-20% 0}}
.ai-chip.done .spark,.ai-chip.done .spark svg{animation:none}

.caret{
  display:inline-block;width:7px;height:1.05em;margin-left:2px;
  vertical-align:text-bottom;background:var(--caret);
  border-radius:1px;
  box-shadow:0 0 10px var(--caret-glow);
  animation:blink 1s steps(2) infinite;
}
@keyframes blink{50%{opacity:0}}

.body{word-break:break-word;line-height:1.7;font-size:15.5px}
.body p{margin:0 0 12px;font-size:15.5px;line-height:1.7;color:var(--ink);white-space:pre-wrap}
.body p:last-child{margin-bottom:0}

.cb{
  background:var(--code);border:1px solid var(--line);
  border-radius:12px;margin:12px 0;overflow:hidden;
  backdrop-filter:blur(10px);
  animation:codeIn .35s ease both;
}
@keyframes codeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ch{
  display:flex;justify-content:space-between;align-items:center;
  padding:7px 14px;border-bottom:1px solid var(--line);
  font:12px 'JetBrains Mono',monospace;
  color:var(--dim);
}
.ch button{
  background:none;border:0;color:var(--dim);font-size:12px;
  padding:2px 8px;border-radius:6px;cursor:pointer;font-family:inherit;
}
.ch button:hover{color:var(--ink);background:var(--box-2)}
pre{
  margin:0;padding:14px 16px;overflow-x:auto;
  font:13px/1.6 'JetBrains Mono',monospace;color:#d4d4d4;
  white-space:pre-wrap;
}
.k{color:#ffffff;font-weight:500}
.s{color:#b8b8b8}
.c{color:#5a5a5a;font-style:italic}
.n{color:#8a8a8a}

footer{padding:6px 18px 14px;position:relative;z-index:2}
.box{
  max-width:720px;margin:0 auto;
  background:var(--box);
  border:1px solid var(--line);
  border-radius:22px;padding:12px 14px 10px;
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  position:relative;
  box-shadow:0 20px 60px -22px rgba(0,0,0,.9);
  transition:border-color .25s,box-shadow .25s;
}
.box:focus-within{
  border-color:var(--focus);
  box-shadow:0 20px 60px -22px rgba(0,0,0,.9),0 0 44px -8px var(--focus-glow);
}
textarea{
  width:100%;border:0;outline:0;background:none;color:var(--ink);
  resize:none;font:16px/1.5 'Space Grotesk',sans-serif;
  max-height:150px;padding:4px 6px;
}
textarea::placeholder{color:var(--dim-2)}
.row{display:flex;align-items:center;gap:5px;margin-top:4px}
select{
  background:rgba(255,255,255,.04);border:0;color:var(--dim);
  font:500 13.5px 'Space Grotesk',sans-serif;
  padding:7px 11px;border-radius:12px;cursor:pointer;
}
select:hover{background:var(--box-2);color:var(--ink)}
select option{color:#000}
#go{
  margin-left:auto;width:38px;height:38px;border-radius:50%;border:0;
  background:#ffffff;color:#0a0a0a;
  display:grid;place-items:center;cursor:pointer;
  box-shadow:0 0 22px rgba(255,255,255,.28);
  transition:box-shadow .25s,transform .15s,background .2s;
}
#go:hover{box-shadow:0 0 34px rgba(255,255,255,.5);background:#fafafa}
#go:active{transform:scale(.96)}
.plus{
  width:38px;height:38px;border-radius:50%;
  border:1px solid var(--line);background:var(--box);
  color:var(--dim);display:grid;place-items:center;cursor:pointer;
  transition:background .2s,color .2s,border-color .2s;
}
.plus:hover{background:var(--box-2);color:var(--ink);border-color:var(--line-2)}
.note{
  text-align:center;font-size:11.5px;color:var(--dim-2);margin-top:8px;
}

.replay{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  background:rgba(255,255,255,.06);border:1px solid var(--line-2);
  color:var(--ink-2);font:500 13px 'Space Grotesk',sans-serif;
  padding:8px 16px;border-radius:999px;cursor:pointer;z-index:5;
  backdrop-filter:blur(10px);
  opacity:0;pointer-events:none;transition:opacity .3s;
}
.replay.on{opacity:1;pointer-events:auto}
.replay:hover{background:rgba(255,255,255,.12);color:#fff}

@media(prefers-reduced-motion:reduce){
  .spark,.spark svg,.shimmer,.caret{animation:none}
}
</style>
</head>
<body>
<div class="blob-3"></div>

<header>
  <button class="icon" aria-label="Menu">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <div class="hgroup">
    <button class="icon" aria-label="Sign in">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
    </button>
    <button class="icon" aria-label="New chat">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>
</header>

<main id="main"><div class="wrap">
  <div class="hero" id="hero">
    <h1>What are we building?</h1>
    <div class="chips">
      <button>Explain this code</button>
      <button>Fix my error</button>
      <button>Solve a problem</button>
      <button>Quiz me</button>
      <button>Build a web page</button>
    </div>
  </div>
  <div id="log"></div>
</div></main>

<footer>
  <div class="box">
    <textarea id="t" rows="1" placeholder="Ask Zyro anything…"></textarea>
    <div class="row">
      <button class="plus" aria-label="Add">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <select><option>Auto</option><option>Fast</option><option>Thinking</option></select>
      <select><option>Chat</option><option>Solver</option><option>Socratic</option><option>Exam prep</option></select>
      <button id="go" aria-label="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </div>
  <p class="note">Zyro can make mistakes. Check important info.</p>
</footer>

<button class="replay" id="replay">↻ Replay animation</button>

<script>
(function(){
  const log = document.getElementById("log");
  const hero = document.getElementById("hero");
  const main = document.getElementById("main");
  const replay = document.getElementById("replay");

  const QUESTION = "Write a debounce function";
  const TEXT = "Here's a clean debounce — it waits until you stop calling, then runs once:";
  const CODE =
`function debounce(fn, ms = 300) {
  let t;
  return (...a) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...a), ms);
  };
}`;

  const sleep = ms => new Promise(r => setTimeout(r, ms));

  /* orange spark — same gradient as your original */
  const SPARK_HTML =
    '<span class="spark"><svg viewBox="0 0 24 24" aria-hidden="true">' +
    '<defs><linearGradient id="sparkGrad" x1="0" y1="0" x2="1" y2="1">' +
    '<stop offset="0" stop-color="#d97757"/>' +
    '<stop offset=".55" stop-color="#f0b48a"/>' +
    '<stop offset="1" stop-color="#d97757"/>' +
    '</linearGradient></defs>' +
    '<path fill="url(#sparkGrad)" d="M12 2l2.6 7.4L22 12l-7.4 2.6L12 22l-2.6-7.4L2 12l7.4-2.6z"/></svg></span>';

  function esc(s){
    return s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  }

  function humanType(el, text){
    return new Promise(res => {
      el.textContent = "";
      const t = document.createElement("span");
      const c = document.createElement("span");
      c.className = "caret";
      el.append(t, c);
      let i = 0;
      (function tick(){
        if (i >= text.length){
          setTimeout(() => { c.remove(); res(); }, 200);
          return;
        }
        const ch = text[i++];
        t.textContent += ch;
        let d = 16 + Math.random() * 40;
        if (",;:".includes(ch)) d += 110;
        if (".!?\n".includes(ch)) d += 200;
        setTimeout(tick, d);
      })();
    });
  }

  function highlight(code){
    return esc(code)
      .replace(/(\/\/[^\n]*)/g, '<span class="c">$1</span>')
      .replace(/("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|`(?:\\.|[^`\\])*`)/g, '<span class="s">$1</span>')
      .replace(/\b(function|return|let|const|var|if|else|for|while|new|=>)\b/g, '<span class="k">$1</span>')
      .replace(/\b(\d+)\b/g, '<span class="n">$1</span>');
  }

  function scrollBottom(){ main.scrollTop = main.scrollHeight; }

  async function play(){
    log.innerHTML = "";
    log.classList.remove("show");
    hero.style.display = "";
    replay.classList.remove("on");
    main.scrollTop = 0;

    await sleep(700);

    hero.style.display = "none";
    log.classList.add("show");

    const u = document.createElement("div");
    u.className = "u";
    u.innerHTML = "<div></div>";
    u.firstChild.textContent = QUESTION;
    log.appendChild(u);
    scrollBottom();

    await sleep(500);

    const a = document.createElement("div");
    a.className = "a";
    const chip = document.createElement("div");
    chip.className = "ai-chip";
    const body = document.createElement("div");
    body.className = "body";
    a.appendChild(chip);
    a.appendChild(body);
    log.appendChild(a);
    scrollBottom();

    // phase 1 — orange sparkle + shimmer
    chip.innerHTML = SPARK_HTML + '<span class="shimmer">Thinking</span>';
    const label = chip.querySelector(".shimmer");
    const stages = ["Thinking", "Analyzing", "Planning steps"];
    let i = 0;
    const cyc = setInterval(() => {
      i = (i + 1) % stages.length;
      label.style.opacity = 0;
      setTimeout(() => { label.textContent = stages[i]; label.style.opacity = 1; }, 170);
    }, 1100);
    await sleep(2600);
    clearInterval(cyc);

    // phase 2 — writing
    label.textContent = "Writing response";
    await sleep(400);

    // phase 3 — type intro
    const p = document.createElement("p");
    body.appendChild(p);
    scrollBottom();
    await humanType(p, TEXT);

    // phase 4 — code block typing
    const cb = document.createElement("div");
    cb.className = "cb";
    cb.innerHTML = '<div class="ch"><span>js</span><span><button>Copy</button></span></div>';
    const pre = document.createElement("pre");
    cb.appendChild(pre);
    body.appendChild(cb);
    scrollBottom();
    await sleep(180);

    await new Promise(res => {
      pre.innerHTML = '<span class="caret"></span>';
      let shown = 0;
      (function tick(){
        if (shown >= CODE.length){
          pre.innerHTML = highlight(CODE);
          setTimeout(res, 200);
          return;
        }
        shown = Math.min(CODE.length, shown + 1);
        pre.innerHTML = highlight(CODE.slice(0, shown)) + '<span class="caret"></span>';
        scrollBottom();
        const ch = CODE[shown - 1] || "";
        let d = 16 + Math.random() * 30;
        if ("{}();".includes(ch)) d += 40;
        if (ch === "\n") d += 90;
        setTimeout(tick, d);
      })();
    });

    // phase 5 — done, checkmark stays orange
    chip.classList.add("done");
    chip.innerHTML = '<span class="check">✓</span><span class="done-text">Done</span>';
    setTimeout(() => chip.classList.add("fade-out"), 900);

    await sleep(1000);
    replay.classList.add("on");
  }

  replay.addEventListener("click", play);
  play();

  const t = document.getElementById("t");
  t.addEventListener("input", () => {
    t.style.height = "auto";
    t.style.height = Math.min(t.scrollHeight, 150) + "px";
  });
})();
</script>
</body>
</html>
