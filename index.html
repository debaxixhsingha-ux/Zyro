<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zyro</title>
<script>try{var m=localStorage.getItem("zyro_theme");if(m)document.documentElement.setAttribute("data-theme",m)}catch(e){}</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js" onload="window.typesetAll&&typesetAll()"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#0a0a0a;--ink:#ececec;--dim:#8b8b8b;--box:#161616;--line:#262626;--hover:#202020;--code:#101010;--acc:#d97757;--hk:#ff7b72;--hs:#a5d6ff;--hc:#7d8590;--hn:#79c0ff;--ht:#ffa657;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#faf9f5;--ink:#1f1e1d;--dim:#6b6860;--box:#fff;--line:#e6e2d6;--hover:#f1eee4;--code:#f4f1e8;--hk:#cf222e;--hs:#0a3069;--hc:#6e7781;--hn:#0550ae;--ht:#953800}}
:root[data-theme="light"]{--bg:#faf9f5;--ink:#1f1e1d;--dim:#6b6860;--box:#fff;--line:#e6e2d6;--hover:#f1eee4;--code:#f4f1e8;--hk:#cf222e;--hs:#0a3069;--hc:#6e7781;--hn:#0550ae;--ht:#953800}
:root[data-theme="dark"]{--bg:#0a0a0a;--ink:#ececec;--dim:#8b8b8b;--box:#161616;--line:#262626;--hover:#202020;--code:#101010}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;height:100vh;height:100dvh;overflow-x:hidden;background:var(--bg);color:var(--ink);font:15.5px/1.65 'Space Grotesk',system-ui,sans-serif;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 18px}
.icon{background:none;border:0;width:36px;height:36px;border-radius:10px;color:var(--dim);display:grid;place-items:center}
.icon:hover{background:var(--hover)}
main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column}
.wrap{width:100%;max-width:720px;margin:0 auto;padding:0 18px;flex:1;display:flex;flex-direction:column}
.hero{margin:auto 0;padding:6vh 0;text-align:center}
.hero h1{font:500 clamp(34px,9vw,52px)/1.12 'Space Grotesk',sans-serif;margin:0;letter-spacing:-1.5px}
#log{padding-bottom:24px}
#log,.a,.body{min-width:0;max-width:100%}
.u{margin:20px 0 6px;display:flex;justify-content:flex-end}
.u>div{background:var(--box);border:1px solid var(--line);padding:10px 16px;border-radius:18px;max-width:88%;white-space:pre-wrap;word-break:break-word}
.a{margin:14px 0}
.body{word-break:break-word}
.body p{margin:0 0 12px;white-space:pre-wrap}
.body h2,.body h3,.body h4{margin:18px 0 8px;font-weight:600;line-height:1.3}
.body h2{font-size:20px}.body h3{font-size:17.5px}.body h4{font-size:15.5px}
.body ul,.body ol{margin:0 0 12px;padding-left:22px}.body li{margin:3px 0}
.body code.i{font:13.5px 'JetBrains Mono',monospace;background:var(--box);border:1px solid var(--line);padding:1px 6px;border-radius:6px}
.cb{background:var(--code);border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden;max-width:100%}
.ch{display:flex;justify-content:space-between;align-items:center;padding:5px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--dim)}
.ch button{background:none;border:0;color:var(--dim);font-size:12px;padding:2px 6px;border-radius:6px}
.ch button:hover{color:var(--ink)}
pre{margin:0;padding:14px;overflow-x:auto;max-width:100%;font:13px/1.55 'JetBrains Mono',monospace}
.rt{font-size:11px;color:var(--dim);margin-top:4px}
.think{margin:4px 0 8px;border:1px solid var(--line);border-radius:10px;background:var(--box);font-size:12px;color:var(--dim)}
.think summary{cursor:pointer;padding:6px 10px;list-style:none;display:flex;gap:6px;align-items:center}
.think summary::-webkit-details-marker{display:none}
.think summary::after{content:"▾";margin-left:auto;transition:transform .2s}
.think[open] summary::after{transform:rotate(180deg)}
.think-body{max-height:140px;overflow-y:auto;padding:6px 10px;border-top:1px solid var(--line);white-space:pre-wrap}
.status-chip{display:inline-flex;align-items:center;gap:9px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--box);color:var(--dim);font-size:12.5px;margin-top:6px;transition:opacity .5s,border-color .3s}
.status-text{transition:opacity .17s,transform .17s}
.status-chip .check{font-weight:700}
.spark{width:16px;height:16px;flex:none;animation:sparkPulse 1.6s ease-in-out infinite;filter:drop-shadow(0 0 6px rgba(217,119,87,.5))}
.spark svg{width:100%;height:100%;display:block;animation:sparkSpin 2.6s linear infinite}
@keyframes sparkSpin{to{transform:rotate(1turn)}}
@keyframes sparkPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
.shimmer{font-weight:500;color:transparent;-webkit-background-clip:text;background-clip:text;background-image:linear-gradient(90deg,var(--dim) 0%,var(--ink) 40%,var(--acc) 50%,var(--ink) 60%,var(--dim) 100%);background-size:220% 100%;animation:shimmer 1.6s linear infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-20% 0}}
.status-chip.done .spark,.status-chip.done .spark svg{animation:none}
.status-chip.done{color:var(--ink)}
.status-chip.fade-out{opacity:0}
.caret{display:inline-block;width:7px;height:1.05em;margin-left:2px;vertical-align:text-bottom;background:var(--ink);box-shadow:0 0 8px rgba(128,128,128,.5);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.spark,.spark svg,.shimmer,.caret{animation:none}}
.scrim{position:fixed;inset:0;background:#0008;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(300px,86vw);background:var(--bg);border-right:1px solid var(--line);transform:translateX(-100%);transition:transform .25s;z-index:21;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
.drawer.on{transform:none}
.dh{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.newc{flex:1;text-align:left;border:1px solid var(--line);background:var(--box);border-radius:14px;padding:10px 14px;font-weight:500}
.newc:hover{background:var(--hover)}
.list{flex:1;overflow-y:auto}
.it{display:flex;align-items:center;border-radius:12px;padding:0 2px 0 12px}
.it:hover,.it.on{background:var(--hover)}
.it .meta{flex:1;min-width:0;cursor:pointer;padding:8px 0}
.it .meta span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14.5px}
.it .meta small{display:block;color:var(--dim);font-size:11px}
.it .icon{width:30px;height:30px;font-size:13px;flex:none}
.empty-l{color:var(--dim);font-size:14px;padding:10px 12px}
.df{font-size:12px;color:var(--dim);padding:8px 4px 0}
.acts{margin-top:6px;display:flex;gap:8px;align-items:center}
.acts button{background:none;border:1px solid var(--line);border-radius:14px;padding:4px 10px;color:var(--dim);font-size:13px;display:inline-flex;align-items:center;gap:4px}
.acts button:hover{background:var(--hover);color:var(--ink)}
.acts button.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.acts svg{display:block}
.ch span button{margin-left:4px}
.pv{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.pv.on{display:flex}
.pvh{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 16px;border-bottom:1px solid var(--line);color:var(--dim)}
.pv iframe{flex:1;border:0;width:100%;background:#fff}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal.on{display:flex}
.mb{background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:18px;width:min(460px,100%)}
.mb h3{margin:0 0 4px;font-weight:600}.mb p{margin:0 0 10px;color:var(--dim);font-size:14px}
#ci{border:1px solid var(--line);border-radius:12px;padding:10px;min-height:140px;max-height:50vh;resize:vertical}
.mr{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.mr button{border:1px solid var(--line);background:none;border-radius:14px;padding:8px 16px}
.mr #ciSave{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fl{margin-top:6px;font-size:13px;color:var(--dim)}
.hk{color:var(--hk)}.hs{color:var(--hs)}.hc{color:var(--hc);font-style:italic}.hn{color:var(--hn)}.ht{color:var(--ht)}
.mx[data-d="1"]{display:block;overflow-x:auto;margin:8px 0;text-align:center}
.atts{display:flex;flex-wrap:wrap;gap:6px;padding:2px 4px 6px}.atts:empty{display:none}
.att{display:inline-flex;align-items:center;gap:6px;background:var(--hover);border-radius:12px;padding:4px 6px 4px 10px;font-size:13px;max-width:100%}
.att button{background:none;border:0;color:var(--dim);padding:0 4px;font-size:12px}
.theme{margin:6px 0 4px;padding-top:10px;border-top:1px solid var(--line)}
.tl{font-size:12px;color:var(--dim);margin:0 4px 8px;text-transform:uppercase;letter-spacing:.06em}
.seg{display:flex;background:var(--box);border:1px solid var(--line);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:11px;padding:8px 6px;font-size:14px;color:var(--dim)}
.seg button.on{background:var(--ink);color:var(--bg)}
.token-section{margin:6px 0 4px;padding-top:10px;border-top:1px solid var(--line)}
.token-bar{background:var(--box);border:1px solid var(--line);border-radius:10px;padding:10px;margin:6px 0}
.token-info{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px;color:var(--dim)}
.token-progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.token-fill{height:100%;background:var(--acc);transition:width .3s}
.tn{font-size:11px;color:var(--dim);margin-top:6px}
.body hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.err{color:#e5484d}
footer{padding:6px 18px 12px}
.box{max-width:720px;margin:0 auto;background:var(--box);border:1px solid var(--line);border-radius:24px;padding:10px 12px 8px;position:relative}
.box:focus-within{border-color:var(--dim)}
textarea{width:100%;border:0;outline:0;background:none;color:var(--ink);resize:none;font:16px/1.5 'Space Grotesk',sans-serif;max-height:170px;padding:4px 6px}
textarea::placeholder{color:var(--dim)}
.row{display:flex;align-items:center;gap:4px;margin-top:4px}
select{background:none;border:0;color:var(--dim);font:500 13.5px 'Space Grotesk',sans-serif;padding:7px 8px;border-radius:14px;cursor:pointer}
select:hover{background:var(--hover)}
select option{color:#000}
#go{margin-left:auto;width:36px;height:36px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center}
#go:disabled{opacity:.35}
.menu{position:absolute;left:8px;bottom:56px;background:var(--box);border:1px solid var(--line);border-radius:16px;padding:6px;min-width:210px;display:none;box-shadow:0 8px 30px #0004;z-index:5}
.menu.open{display:block}
.menu button{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:0;padding:9px 10px;border-radius:10px;color:var(--dim);font-size:14px;text-align:left}
.menu button:hover{background:var(--hover)}
.menu em{font:500 10.5px 'Space Grotesk';font-style:normal;border:1px solid var(--line);padding:1px 7px;border-radius:10px}
.jump{position:fixed;right:20px;bottom:110px;background:var(--box);border:1px solid var(--line);color:var(--ink);border-radius:50%;width:40px;height:40px;font-size:20px;display:none;z-index:15;box-shadow:0 4px 12px #0004;align-items:center;justify-content:center}
.jump.on{display:flex}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
.note{text-align:center;font-size:11.5px;color:var(--dim);margin-top:7px}
</style>
</head>
<body>
<header><button class="icon" id="burger" aria-label="Menu" style="color:var(--ink)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
<button class="icon" id="new" aria-label="New chat"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></header>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
<div class="dh"><button class="newc" id="newc">+ New chat</button><button class="icon" id="closeD" aria-label="Close">✕</button></div>
<div class="tl" style="margin-top:2px">Recent chats</div>
<div class="list" id="list"></div>
<div class="token-section">
<div class="tl">Today's tokens</div>
<div class="token-bar">
<div class="token-info"><span id="tPct">0% of 100% used</span><span id="tLast"></span></div>
<div class="token-progress"><div class="token-fill" id="fTotal" style="width:0%"></div></div>
<div class="tn" id="tNote">Counts your messages + replies · refills daily</div>
</div>
</div>
<div class="theme"><div class="tl">Appearance</div><div class="seg"><button type="button" data-th="light">☀ Daylight</button><button type="button" data-th="dark">☾ Midnight</button></div></div>
<div class="df">Chats are saved only on this device</div>
</aside>
<main id="main"><div class="wrap">
<div class="hero" id="hero"><h1>What are we building?</h1></div>
<div id="log"></div></div></main>
<footer><form id="f" class="box">
<div class="menu" id="menu"></div>
<div class="atts" id="atts"></div><textarea id="t" rows="1" placeholder="Ask Zyro anything…"></textarea>
<div class="row"><button type="button" class="icon" id="plus" aria-label="Add"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<select id="mode" aria-label="Mode"></select>
<button id="go" type="submit" aria-label="Send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div></form>
<input type="file" id="file" hidden multiple accept=".pdf,.txt,.md,.py,.js,.ts,.jsx,.tsx,.html,.css,.json,.java,.c,.cpp,.h,.cs,.go,.rs,.php,.rb,.kt,.swift,.sql,.sh,.yml,.yaml,.xml,.csv,.ipynb,.ino,.tex,.r,.m">
<div class="note">Zyro can make mistakes. Check important info.</div></footer>
<button class="jump" id="jump" aria-label="Scroll to bottom">↓</button>
<div class="pv" id="pv"><div class="pvh"><span>Preview</span><button class="icon" id="pvx" aria-label="Close">✕</button></div><iframe id="pvf" sandbox="allow-scripts" title="Preview"></iframe></div>
<div class="modal" id="modal"><div class="mb"><h3>Custom instructions</h3><p>Tell Zyro how to answer. Saved only on this device.</p><textarea id="ci" placeholder="e.g. Keep answers short. Explain like I am a beginner."></textarea><div class="mr"><button id="ciCancel" type="button">Cancel</button><button id="ciSave" type="button">Save</button></div></div></div>
<div class="toast" id="toast"></div>
<script src="app.js?v=14"></script>
</body>
</html>
