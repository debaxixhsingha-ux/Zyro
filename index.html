<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zyro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#0a0a0a;--ink:#ececec;--dim:#8b8b8b;--box:#161616;--line:#262626;--hover:#202020;--code:#101010;--acc:#d97757;--accink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#faf9f5;--ink:#1f1e1d;--dim:#6b6860;--box:#fff;--line:#e6e2d6;--hover:#f1eee4;--code:#f4f1e8}}
:root[data-theme="light"]{--bg:#faf9f5;--ink:#1f1e1d;--dim:#6b6860;--box:#fff;--line:#e6e2d6;--hover:#f1eee4;--code:#f4f1e8}
:root[data-theme="dark"]{--bg:#0a0a0a;--ink:#ececec;--dim:#8b8b8b;--box:#161616;--line:#262626;--hover:#202020;--code:#101010}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15.5px/1.65 'Space Grotesk',system-ui,sans-serif;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 18px}
.brand{color:var(--ink);display:flex;align-items:center}
.icon{background:none;border:0;width:36px;height:36px;border-radius:10px;color:var(--dim);display:grid;place-items:center}
.icon:hover{background:var(--hover)}
main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.wrap{width:100%;max-width:720px;margin:0 auto;padding:0 18px;flex:1;display:flex;flex-direction:column}
.hero{margin:auto 0;padding:6vh 0;text-align:center}
.hero h1{font:500 clamp(34px,9vw,52px)/1.12 'Space Grotesk',sans-serif;margin:0 0 8px;letter-spacing:-1.5px}
.hero p{margin:0 0 26px;color:var(--dim)}
.sug{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sug button{border:1px solid var(--line);background:none;border-radius:20px;padding:8px 14px;font-size:14px;color:var(--dim)}
.sug button:hover{background:var(--hover);color:var(--ink)}
#log{padding-bottom:24px}
.u{margin:20px 0 6px;display:flex;justify-content:flex-end}
.u div{background:var(--box);border:1px solid var(--line);padding:10px 16px;border-radius:18px;max-width:88%;white-space:pre-wrap;word-break:break-word}
.a{margin:14px 0}
.body{word-break:break-word}
.body p{margin:0 0 12px;white-space:pre-wrap}
.body h2,.body h3,.body h4{margin:18px 0 8px;font-weight:600;line-height:1.3}
.body h2{font-size:20px}.body h3{font-size:17.5px}.body h4{font-size:15.5px}
.body ul,.body ol{margin:0 0 12px;padding-left:22px}.body li{margin:3px 0}
.body code.i{font:13.5px 'JetBrains Mono',monospace;background:var(--box);border:1px solid var(--line);padding:1px 6px;border-radius:6px}
.cb{background:var(--code);border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
.ch{display:flex;justify-content:space-between;align-items:center;padding:5px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--dim)}
.ch button{background:none;border:0;color:var(--dim);font-size:12px;padding:2px 6px;border-radius:6px}
.ch button:hover{color:var(--ink)}
pre{margin:0;padding:14px;overflow-x:auto;font:13px/1.55 'JetBrains Mono',monospace}
.status-chip{display:inline-flex;align-items:center;gap:9px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--box);color:var(--dim);font-size:12.5px;margin-top:6px;transition:opacity .5s,border-color .3s}
.status-text{transition:opacity .17s,transform .17s}
.status-chip .check{font-weight:700}
.dots::after{content:'';display:inline-block;width:14px;text-align:left;animation:dots 1.2s steps(4,end) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.orb{width:15px;height:15px;border-radius:50%;flex:none;background:conic-gradient(var(--ink),var(--dim),var(--ink),var(--dim),var(--ink));-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 0);mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 0);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
.pulse{width:86px;height:20px;flex:none}
.pulse path{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pulse .base{stroke:var(--line)}
.pulse .run{stroke:var(--ink);stroke-dasharray:18 160;animation:run 1.1s linear infinite}
@keyframes run{to{stroke-dashoffset:-178}}
.status-chip.done{color:var(--ink)}
.status-chip.fade-out{opacity:0}
.caret{display:inline-block;width:7px;height:1.05em;margin-left:2px;vertical-align:text-bottom;background:var(--ink);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.orb,.pulse .run,.caret,.dots::after{animation:none}}
.body hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.err{color:#e5484d}
footer{padding:6px 18px 12px}
.box{max-width:720px;margin:0 auto;background:var(--box);border:1px solid var(--line);border-radius:24px;padding:10px 12px 8px;position:relative}
.box:focus-within{border-color:var(--dim)}
textarea{width:100%;border:0;outline:0;background:none;color:var(--ink);resize:none;font:15.5px/1.5 'Space Grotesk',sans-serif;max-height:170px;padding:4px 6px}
textarea::placeholder{color:var(--dim)}
.row{display:flex;align-items:center;gap:4px;margin-top:4px}
select{background:none;border:0;color:var(--dim);font:500 13.5px 'Space Grotesk',sans-serif;padding:7px 8px;border-radius:14px;cursor:pointer}
select:hover{background:var(--hover)}
select option{color:#000}
#go{margin-left:auto;width:36px;height:36px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center}
#go:disabled{opacity:.35}
.menu{position:absolute;left:8px;bottom:56px;background:var(--box);border:1px solid var(--line);border-radius:16px;padding:6px;min-width:210px;display:none;box-shadow:0 8px 30px #0004;z-index:5}
.menu.open{display:block}
.menu button{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:0;padding:9px 10px;border-radius:10px;color:var(--dim);font-size:14px;text-align:left}
.menu button:hover{background:var(--hover)}
.menu em{font:500 10.5px 'Space Grotesk';font-style:normal;border:1px solid var(--line);padding:1px 7px;border-radius:10px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
.note{text-align:center;font-size:11.5px;color:var(--dim);margin-top:7px}
</style>
</head>
<body>
<header><div class="brand" aria-label="Zyro"><svg width="30" height="30" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="28" height="28" rx="9" stroke-width="2.4"/><path d="M10 10.5h12L10 21.5h12"/></svg></div>
<button class="icon" id="new" aria-label="New chat"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></header>
<main id="main"><div class="wrap">
<div class="hero" id="hero"><h1>What are we building?</h1><p>Zyro, your code assistant.</p><div class="sug" id="sug"></div></div>
<div id="log"></div></div></main>
<footer><form id="f" class="box">
<div class="menu" id="menu"></div>
<textarea id="t" rows="1" placeholder="Ask Zyro to write, fix or explain code"></textarea>
<div class="row"><button type="button" class="icon" id="plus" aria-label="Add"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<select id="mode" aria-label="Mode"></select>
<button id="go" type="submit" aria-label="Send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div></form>
<div class="note">Zyro can make mistakes. Check important code.</div></footer>
<div class="toast" id="toast"></div>
<script>
// 1) Deploy worker.js on Cloudflare, then paste its URL here:
const WORKER_URL="https://zyro-ai.debaxixhsingha.workers.dev/";
const useWorker=WORKER_URL&&!WORKER_URL.includes("YOUR-WORKER");
const MODES={Write:"Write clean, working code for the request.",Debug:"Find the bug(s). Explain the cause briefly, then give fixed code.",Explain:"Explain what the code does, step by step, concisely.",Refactor:"Refactor for readability and performance. Show improved code and what changed.",Review:"Review the code: bugs, security, style, edge cases, ranked by severity."};
const SUG=[["Write a debounce function","Write"],["Why is my loop infinite?","Debug"],["Explain async/await","Explain"],["Clean up my function","Refactor"]];
const SOON=["Upload PDF","Add image","Connect GitHub","Voice input","Run code"];
const STAGES=["Thinking","Analyzing request","Planning steps","Choosing approach"];
const PULSE='<svg class="pulse" viewBox="0 0 120 28" aria-hidden="true"><path class="base" d="M0 14 H28 L36 6 L44 22 L52 10 L58 14 H120"/><path class="run" d="M0 14 H28 L36 6 L44 22 L52 10 L58 14 H120"/></svg>';
let hist=[],busy=false,sample=null;
const $=id=>document.getElementById(id),log=$("log"),t=$("t"),go=$("go"),main=$("main");
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
Object.keys(MODES).forEach(m=>$("mode").add(new Option(m)));
SUG.forEach(([txt,m])=>{const b=document.createElement("button");b.type="button";b.textContent=txt;b.onclick=()=>{$("mode").value=m;t.value=txt;t.focus()};$("sug").appendChild(b)});
SOON.forEach(s=>{const b=document.createElement("button");b.type="button";b.innerHTML=`<span>${s}</span><em>Soon</em>`;b.onclick=()=>{toast(s+" is coming soon");$("menu").classList.remove("open")};$("menu").appendChild(b)});
$("plus").onclick=e=>{e.stopPropagation();$("menu").classList.toggle("open")};
document.addEventListener("click",()=>$("menu").classList.remove("open"));
function toast(m){const e=$("toast");e.textContent=m;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1600)}
const inl=x=>esc(x).replace(/`([^`]+)`/g,'<code class="i">$1</code>').replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
function txt(p){let h="",l=null,pa=[];const fp=()=>{if(pa.length){h+="<p>"+inl(pa.join("\n"))+"</p>";pa=[]}},fl=()=>{if(l){h+="</"+l+">";l=null}};
for(const ln of p.split("\n")){let m;
if(m=ln.match(/^\s{0,3}(#{1,6})\s+(.*)/)){fp();fl();const n=Math.min(m[1].length+1,4);h+=`<h${n}>${inl(m[2])}</h${n}>`}
else if(/^\s*([-*_])\1{2,}\s*$/.test(ln)){fp();fl();h+="<hr>"}
else if(m=ln.match(/^\s*[-*]\s+(.*)/)){fp();if(l!=="ul"){fl();h+="<ul>";l="ul"}h+="<li>"+inl(m[1])+"</li>"}
else if(m=ln.match(/^\s*\d+[.)]\s+(.*)/)){fp();if(l!=="ol"){fl();h+="<ol>";l="ol"}h+="<li>"+inl(m[1])+"</li>"}
else if(!ln.trim()){fp();fl()}
else{fl();pa.push(ln)}}
fp();fl();return h}
function md(src){let h="";src.split(/```/).forEach((p,i)=>{if(i%2){const nl=p.indexOf("\n"),l=nl>-1?p.slice(0,nl).trim():"",c=nl>-1?p.slice(nl+1):p;
 h+=`<div class="cb"><div class="ch"><span>${esc(l||"code")}</span><button type="button" data-c>Copy</button></div><pre>${esc(c.replace(/\n$/,""))}</pre></div>`}
 else h+=txt(p)});return h}
function addU(txt){const d=document.createElement("div");d.className="u";d.innerHTML="<div></div>";d.firstChild.textContent=txt;log.appendChild(d)}
function addA(){const d=document.createElement("div");d.className="a";d.innerHTML='<div class="body"></div><div class="status-chip" role="status"></div>';log.appendChild(d);return d}
function down(f){if(f||main.scrollHeight-main.scrollTop-main.clientHeight<140)main.scrollTop=main.scrollHeight}
const withCaret=h=>/<\/p>$/.test(h)?h.replace(/<\/p>$/,'<span class="caret"></span></p>'):h+'<span class="caret"></span>';
function startChip(chip){let i=0;chip.innerHTML='<span class="orb"></span><span class="status-text">Thinking</span><span class="dots"></span>';
 const label=chip.querySelector(".status-text");
 const iv=setInterval(()=>{i=(i+1)%STAGES.length;label.style.opacity=0;label.style.transform="translateY(3px)";setTimeout(()=>{label.textContent=STAGES[i];label.style.opacity=1;label.style.transform="none"},170)},1400);
 return{write(){if(chip.dataset.w)return;chip.dataset.w=1;clearInterval(iv);chip.innerHTML=PULSE+'<span class="status-text">Writing response</span><span class="dots"></span>'},
 done(){clearInterval(iv);chip.classList.add("done");chip.innerHTML='<span class="check">\u2713</span><span class="status-text">Done</span>';setTimeout(()=>chip.classList.add("fade-out"),900);setTimeout(()=>chip.remove(),1500)},
 stop(){clearInterval(iv);chip.remove()}}}
function copy(txt,btn){const ok=()=>{btn.textContent="Copied";setTimeout(()=>btn.textContent="Copy",1200)};
 const fb=()=>{const a=document.createElement("textarea");a.value=txt;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(_){}a.remove()};
 navigator.clipboard?navigator.clipboard.writeText(txt).then(ok).catch(fb):fb()}
log.addEventListener("click",e=>{if(e.target.dataset.c!==undefined)copy(e.target.closest(".cb").querySelector("pre").textContent,e.target)});
const SYS=()=>`You are Zyro, an expert AI code assistant. Mode: ${$("mode").value}. ${MODES[$("mode").value]} Infer the language from context. Be concise. Put all code in fenced blocks with a language tag. No filler. Avoid tables.`;
async function groqStream(messages,onText){
 const r=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages})});
 if(!r.ok||!r.body)throw{code:r.status===429?"rate":"http"};
 const rd=r.body.getReader(),dec=new TextDecoder();let buf="",full="";
 for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
  const lines=buf.split("\n");buf=lines.pop();
  for(const ln of lines){if(!ln.startsWith("data:"))continue;const d=ln.slice(5).trim();if(d==="[DONE]")continue;
   try{const j=JSON.parse(d),c=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;if(c){full+=c;onText(full)}}catch(_){}}}
 return full}
async function send(text){if(busy||!text.trim())return;busy=true;go.disabled=true;
 $("hero").style.display="none";addU(text);
 const d=addA(),body=d.firstChild,c=startChip(d.lastChild);down(1);
try{let out;const show=x=>{c.write();body.innerHTML=withCaret(md(x));down()};
  if(useWorker){out=await groqStream([{role:"system",content:SYS()},...hist,{role:"user",content:text}],show)}
  else{if(!sample)sample=await claude.use("sample").catch(()=>null);
   if(!sample)throw{code:"na"};
   const r=await sample([...hist,{role:"user",content:"["+SYS()+"]\n\n"+text}],{cache:false,modelTier:"default",onText:({text})=>show(text)});out=r.text}
  out=out||"(empty response)";body.innerHTML=md(out);hist.push({role:"user",content:text},{role:"assistant",content:out});c.done()}
 catch(e){c.stop();const na=e&&e.code==="na";if(!na){t.value=text;t.dispatchEvent(new Event("input"))}
  body.innerHTML=`<span class="err">${na?"AI is unavailable here. Open this page inside Claude.":e&&e.code==="rate"?"Rate limit hit. Wait a minute, then retry.":e&&e.code==="not_granted"?"Permission needed to use AI.":"Something failed. Your message is back in the box, try again."}</span>`}
 busy=false;go.disabled=false;down()}
$("f").onsubmit=e=>{e.preventDefault();const v=t.value;t.value="";t.style.height="auto";send(v)};
$("new").onclick=()=>{if(busy)return;hist=[];log.innerHTML="";$("hero").style.display="";t.focus()};
t.addEventListener("input",()=>{t.style.height="auto";t.style.height=Math.min(t.scrollHeight,170)+"px"});
t.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing&&matchMedia("(hover:hover)").matches){e.preventDefault();$("f").requestSubmit()}});
</script>
</body>
</html>
