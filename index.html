<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>

box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#faf9f5;--ink:#1f1e1d;--dim:#6b6860;--box:#fff;--line:#e6e2d6;--hover:#f1eee4;--code:#f4f1e8;--hk:#cf222e;--hs:#0a3069;--hc:#6e7781;--hn:#0550ae;--ht:#953800}}
:root[data-theme="light"]{--bg:#faf9f5;--ink:#1f1e1d;--dim:#6b6860;--box:#fff;--line:#e6e2d6;--hover:#f1eee4;--code:#f4f1e8;--hk:#cf222e;--hs:#0a3069;--hc:#6e7781;--hn:#0550ae;--ht:#953800}
:root[data-theme="dark"]{--bg:#0a0a0a;--ink:#ececec;--dim:#8b8b8b;--box:#161616;--line:#262626;--hover:#202020;--code:#101010}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15.5px/1.65 'Space Grotesk',system-ui,sans-serif;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 18px}
.brand{color:var(--ink);display:flex;align-items:center}
.icon{background:none;border:0;width:36px;height:36px;border-radius:10px;color:var(--dim);display:grid;place-items:center}
.icon:hover{background:var(--hover)}
main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.wrap{width:100%;max-width:720px;margin:0 auto;padding:0 18px;flex:1;display:flex;flex-direction:column}
.hero{margin:auto 0;padding:6vh 0;text-align:center}
.hero h1{font:500 clamp(34px,9vw,52px)/1.12 'Space Grotesk',sans-serif;margin:0 0 8px;letter-spacing:-1.5px}
.hero p{margin:0 0 26px;color:var(--dim)}
.sug{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sug button{border:1px solid var(--line);background:none;border-radius:20px;padding:8px 14px;font-size:14px;color:var(--dim)}
.sug button:hover{background:var(--hover);color:var(--ink)}
#log{padding-bottom:24px}
.u{margin:20px 0 6px;display:flex;justify-content:flex-end}
.u>div{background:var(--box);border:1px solid var(--line);padding:10px 16px;border-radius:18px;max-width:88%;white-space:pre-wrap;word-break:break-word}
.a{margin:14px 0}
.body{word-break:break-word}
.body p{margin:0 0 12px;white-space:pre-wrap}
.body h2,.body h3,.body h4{margin:18px 0 8px;font-weight:600;line-height:1.3}
.body h2{font-size:20px}.body h3{font-size:17.5px}.body h4{font-size:15.5px}
.body ul,.body ol{margin:0 0 12px;padding-left:22px}.body li{margin:3px 0}
.body code.i{font:13.5px 'JetBrains Mono',monospace;background:var(--box);border:1px solid var(--line);padding:1px 6px;border-radius:6px}
.cb{background:var(--code);border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
.ch{display:flex;justify-content:space-between;align-items:center;padding:5px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--dim)}
.ch button{background:none;border:0;color:var(--dim);font-size:12px;padding:2px 6px;border-radius:6px}
.ch button:hover{color:var(--ink)}
pre{margin:0;padding:14px;overflow-x:auto;font:13px/1.55 'JetBrains Mono',monospace}
.status-chip{display:inline-flex;align-items:center;gap:9px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--box);color:var(--dim);font-size:12.5px;margin-top:6px;transition:opacity .5s,border-color .3s}
.status-text{transition:opacity .17s,transform .17s}
.status-chip .check{font-weight:700}
.spark{width:16px;height:16px;flex:none;animation:sparkPulse 1.6s ease-in-out infinite;filter:drop-shadow(0 0 6px rgba(217,119,87,.5))}
.spark svg{width:100%;height:100%;display:block;animation:sparkSpin 2.6s linear infinite}
@keyframes sparkSpin{to{transform:rotate(1turn)}}
@keyframes sparkPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
.shimmer{font-weight:500;color:transparent;-webkit-background-clip:text;background-clip:text;background-image:linear-gradient(90deg,var(--dim) 0%,var(--ink) 40%,var(--acc) 50%,var(--ink) 60%,var(--dim) 100%);background-size:220% 100%;animation:shimmer 1.6s linear infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-20% 0}}
.status-chip.done .spark,.status-chip.done .spark svg{animation:none}
.status-chip.done{color:var(--ink)}
.status-chip.fade-out{opacity:0}
.caret{display:inline-block;width:7px;height:1.05em;margin-left:2px;vertical-align:text-bottom;background:var(--ink);box-shadow:0 0 8px rgba(128,128,128,.5);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.spark,.spark svg,.shimmer,.caret{animation:none}}
.scrim{position:fixed;inset:0;background:#0008;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(300px,86vw);background:var(--bg);border-right:1px solid var(--line);transform:translateX(-100%);transition:transform .25s;z-index:21;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
.drawer.on{transform:none}
.dh{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.newc{flex:1;text-align:left;border:1px solid var(--line);background:var(--box);border-radius:14px;padding:10px 14px;font-weight:500}
.newc:hover{background:var(--hover)}
.list{flex:1;overflow-y:auto}
.it{display:flex;align-items:center;border-radius:12px;padding:0 2px 0 12px}

.it .icon{width:32px;height:32px;font-size:13px}
.empty-l{color:var(--dim);font-size:14px;padding:10px 12px}
.df{font-size:12px;color:var(--dim);padding:8px 4px 0}
.acts{margin-top:6px}
.acts button{background:none;border:1px solid var(--line);border-radius:14px;padding:4px 12px;color:var(--dim);font-size:13px}

.ch span button{margin-left:4px}

.pv.on{display:flex}
.pvh{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 16px;border-bottom:1px solid var(--line);color:var(--dim)}
.pv iframe{flex:1;border:0;width:100%;background:#fff}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal.on{display:flex}
.mb{background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:18px;width:min(460px,100%)}

.fl{margin-top:6px;font-size:13px;color:var(--dim)}

.atts{display:flex;flex-wrap:wrap;gap:6px;padding:2px 4px 6px}.atts:empty{display:none}

.theme{margin:6px 0 4px;padding-top:10px;border-top:1px solid var(--line)}
.tl{font-size:12px;color:var(--dim);margin:0 4px 8px;text-transform:uppercase;letter-spacing:.06em}
.seg{display:flex;background:var(--box);border:1px solid var(--line);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:11px;padding:8px 6px;font-size:14px;color:var(--dim)}
.seg button.on{background:var(--ink);color:var(--bg)}
.body hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.err{color:#e5484d}
footer{padding:6px 18px 12px}
.box{max-width:720px;margin:0 auto;background:var(--box);border:1px solid var(--line);border-radius:24px;padding:10px 12px 8px;position:relative}
.box:focus-within{border-color:var(--dim)}
textarea{width:100%;border:0;outline:0;background:none;color:var(--ink);resize:none;font:16px/1.5 'Space Grotesk',sans-serif;max-height:170px;padding:4px 6px}
textarea::placeholder{color:var(--dim)}
.row{display:flex;align-items:center;gap:4px;margin-top:4px}
select{background:none;border:0;color:var(--dim);font:500 13.5px 'Space Grotesk',sans-serif;padding:7px 8px;border-radius:14px;cursor:pointer}
select:hover{background:var(--hover)}
select option{color:#000}
#go{margin-left:auto;width:36px;height:36px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center}
#go:disabled{opacity:.35}
.menu{position:absolute;left:8px;bottom:56px;background:var(--box);border:1px solid var(--line);border-radius:16px;padding:6px;min-width:210px;display:none;box-shadow:0 8px 30px #0004;z-index:5}
.menu.open{display:block}
.menu button{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:0;padding:9px 10px;border-radius:10px;color:var(--dim);font-size:14px;text-align:left}
.menu button:hover{background:var(--hover)}
.menu em{font:500 10.5px 'Space Grotesk';font-style:normal;border:1px solid var(--line);padding:1px 7px;border-radius:10px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
.note{text-align:center;font-size:11.5px;color:var(--dim);margin-top:7px}
</style>
</head>
<body>
<header><button class="icon" id="burger" aria-label="Menu" style="color:var(--ink)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
<button class="icon" id="new" aria-label="New chat"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></header>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"><div class="dh"><button class="newc" id="newc">+ New chat</button><button class="icon" id="closeD" aria-label="Close">✕</button></div><div class="list" id="list"></div><div class="theme"><div class="tl">Appearance</div><div class="seg"><button type="button" data-th="light">☀ Daylight</button><button type="button" data-th="dark">☾ Midnight</button></div></div><div class="df">Chats are saved only on this device</div></aside>
<main id="main"><div class="wrap">
<div class="hero" id="hero"><h1>What are we building?</h1><p>Zyro: code, AI/ML and B.Tech help.</p><div class="sug" id="sug"></div></div>
<div id="log"></div></div></main>
<footer><form id="f" class="box">
<div class="menu" id="menu"></div>
<div class="atts" id="atts"></div><textarea id="t" rows="1" placeholder="Ask Zyro to write, fix or explain code"></textarea>
<div class="row"><button type="button" class="icon" id="plus" aria-label="Add"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<select id="mode" aria-label="Mode"></select>
<button id="go" type="submit" aria-label="Send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div></form>
<input type="file" id="file" hidden multiple accept=".pdf,.txt,.md,.py,.js,.ts,.jsx,.tsx,.html,.css,.json,.java,.c,.cpp,.h,.cs,.go,.rs,.php,.rb,.kt,.swift,.sql,.sh,.yml,.yaml,.xml,.csv,.ipynb,.ino,.tex,.r,.m">
<div class="note">Zyro can make mistakes. Check important code.</div></footer>
<div class="pv" id="pv"><div class="pvh"><span>Preview</span><button class="icon" id="pvx" aria-label="Close">✕</button></div><iframe id="pvf" sandbox="allow-scripts" title="Preview"></iframe></div>
<div class="modal" id="modal"><div class="mb"><h3>Custom instructions</h3><p>Tell Zyro how to answer. Saved only on this device.</p><textarea id="ci" placeholder="e.g. Use React + Tailwind. Keep answers short. Explain like I am a beginner."></textarea><div class="mr"><button id="ciCancel" type="button">Cancel</button><button id="ciSave" type="button">Save</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const MODEL="openai/gpt-oss-120b";
const KEYNAME="zyro_groq_key";
const getKey=()=>{try{return localStorage.getItem(KEYNAME)||""}catch(_){return""}};
const setKey=k=>{try{k?localStorage.setItem(KEYNAME,k):localStorage.removeItem(KEYNAME)}catch(_){}};
function askKey(){const k=prompt("Paste your Groq API key. It is saved only on this device.");if(k&&k.trim()){setKey(k.trim());return true}return false}
const CI="zyro_ci";
const getCI=()=>{try{return localStorage.getItem(CI)||""}catch(_){return""}};
const MODES={Write:"Write clean, working code for the request.",Debug:"Find the bug(s). Explain the cause briefly, then give fixed code.",Explain:"Explain what the code does, step by step, concisely.",Refactor:"Refactor for readability and performance. Show improved code and what changed.",Review:"Review the code: bugs, security, style, edge cases, ranked by severity."};
const SUG=[["Write a debounce function","Write"],["Why is my loop infinite?","Debug"],["Explain async/await","Explain"],["Clean up my function","Refactor"]];
const SOON=["Add image","Connect GitHub","Voice input"];
const STAGES=["Thinking","Analyzing","Planning steps"];
let skip=false,ctrl=null,hist=[],busy=false,sample=null;
const $=id=>document.getElementById(id),log=$("log"),t=$("t"),go=$("go"),main=$("main");
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
Object.keys(MODES).forEach(m=>$("mode").add(new Option(m)));
SUG.forEach(([txt,m])=>{const b=document.createElement("button");b.type="button";b.textContent=txt;b.onclick=()=>{$("mode").value=m;t.value=txt;t.focus()};$("sug").appendChild(b)});
{const b=document.createElement("button");b.id="keyb";b.type="button";b.innerHTML="<span>API key</span><em>"+(getKey()?"Saved":"Add")+"</em>";b.onclick=()=>{if(askKey()){toast("Key saved");b.lastChild.textContent="Saved"}};$("menu").appendChild(b)}
{const b=document.createElement("button");b.id="cib";b.type="button";b.innerHTML="<span>Instructions</span><em>"+(getCI()?"On":"Add")+"</em>";b.onclick=()=>{$("ci").value=getCI();$("modal").classList.add("on")};$("menu").appendChild(b)}
{const b=document.createElement("button");b.type="button";b.innerHTML="<span>Upload file or PDF</span><em>Code, PDF</em>";b.onclick=()=>$("file").click();$("menu").appendChild(b)}
SOON.forEach(s=>{const b=document.createElement("button");b.type="button";b.innerHTML=`<span>${s}</span><em>Soon</em>`;b.onclick=()=>{toast(s+" is coming soon");$("menu").classList.remove("open")};$("menu").appendChild(b)});
$("plus").onclick=e=>{e.stopPropagation();const cb=$("cib");if(cb)cb.lastChild.textContent=getCI()?"On":"Add";const kb=$("keyb");if(kb)kb.lastChild.textContent=getKey()?"Saved":"Add";$("menu").classList.toggle("open")};
document.addEventListener("click",()=>$("menu").classList.remove("open"));
function toast(m){const e=$("toast");e.textContent=m;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1600)}
const escA=s=>esc(s).replace(/"/g,"&quot;");
const MR=/\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$([^\s$](?:[^$\n]*?[^\s$])?)\$(?!\d)/g;
const inl=x=>{const st=[],tk=h=>"\u0001"+(st.push(h)-1)+"\u0002";
 x=x.replace(/`([^`]+)`/g,(_,c)=>tk('<code class="i">'+esc(c)+'</code>'));
 x=x.replace(MR,(m,a,b,c,d)=>{if(d!==undefined&&!/[\\^_=+\-*\/<>{}()]|^[A-Za-z]$|\d/.test(d))return m;return tk('<span class="mx" data-d="'+(a!==undefined||b!==undefined?1:0)+'" data-tex="'+escA(a??b??c??d)+'">'+esc(m)+'</span>')});
 return esc(x).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\u0001(\d+)\u0002/g,(_,i)=>st[i])};
function txt(p){let h="",l=null,pa=[];const fp=()=>{if(pa.length){h+="<p>"+inl(pa.join("\n"))+"</p>";pa=[]}},fl=()=>{if(l){h+="</"+l+">";l=null}};
for(const ln of p.split("\n")){let m;
if(m=ln.match(/^\s{0,3}(#{1,6})\s+(.*)/)){fp();fl();const n=Math.min(m[1].length+1,4);h+=`<h${n}>${inl(m[2])}</h${n}>`}
else if(/^\s*([-*_])\1{2,}\s*$/.test(ln)){fp();fl();h+="<hr>"}
else if(m=ln.match(/^\s*[-*]\s+(.*)/)){fp();if(l!=="ul"){fl();h+="<ul>";l="ul"}h+="<li>"+inl(m[1])+"</li>"}
else if(m=ln.match(/^\s*\d+[.)]\s+(.*)/)){fp();if(l!=="ol"){fl();h+="<ol>";l="ol"}h+="<li>"+inl(m[1])+"</li>"}
else if(!ln.trim()){fp();fl()}
else{fl();pa.push(ln)}}
fp();fl();return h}
const KW=new Set("abstract and as assert async await break case catch class const continue def default del do elif else enum except export extends final finally for from fn func function if implements import in interface is lambda let loop match mod mut namespace new not null None nil of or package pass private protected pub public raise return self static struct super switch this throw throws trait true True false False try type typeof union unsafe use using var void while with yield select insert update delete create table where join group order by limit values SELECT INSERT UPDATE DELETE CREATE TABLE WHERE JOIN GROUP ORDER BY LIMIT VALUES FROM AS AND OR NOT NULL INTO SET".split(" "));
const HASH=/^(py|python|bash|sh|shell|zsh|ruby|rb|yaml|yml|toml|r|perl|dockerfile|makefile|ini|conf|powershell|ps1)$/i;
const CM={h:/#[^\n]*/,q:/--[^\n]*|\/\*[\s\S]*?\*\//,s:/\/\/[^\n]*|\/\*[\s\S]*?\*\/|<!--[\s\S]*?-->/};
const REST=/("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|`(?:\\.|[^`\\])*`)|(\b0x[0-9a-f]+\b|\b\d[\d_]*(?:\.\d+)?(?:e[+-]?\d+)?\b)|(\b[A-Za-z_]\w*\b)/;
const RX={};
function hl(c,l){if(c.length>20000)return esc(c);const k=HASH.test(l)?"h":/^sql$/i.test(l)?"q":"s",re=RX[k]||(RX[k]=new RegExp("("+CM[k].source+")|"+REST.source,"gi"));
 re.lastIndex=0;let o="",last=0,m;
 while((m=re.exec(c))){if(m[0]==="")break;o+=esc(c.slice(last,m.index));last=re.lastIndex;const t=m[0],q=m[1]?"c":m[2]?"s":m[3]?"n":KW.has(t)?"k":/^[A-Z][a-z]/.test(t)?"t":"";
  o+=q?'<span class="h'+q+'">'+esc(t)+"</span>":esc(t)}
 return o+esc(c.slice(last))}
function typeset(root){if(!window.katex)return;root.querySelectorAll(".mx:not([data-k])").forEach(el=>{try{el.innerHTML=katex.renderToString(el.dataset.tex,{displayMode:el.dataset.d==="1",throwOnError:false});el.dataset.k=1}catch(_){}})}
function setH(el,h){el.innerHTML=h;typeset(el)}
function typesetAll(){typeset(document)}
function md(src){let h="";src.split(/```/).forEach((p,i)=>{if(i%2){const nl=p.indexOf("\n"),l=nl>-1?p.slice(0,nl).trim():"",c=nl>-1?p.slice(nl+1):p;
 h+=`<div class="cb"><div class="ch"><span>${esc(l||"code")}</span><span>${/^html?$/i.test(l)||(!l&&/<!doctype|<html/i.test(c))?'<button type="button" data-p>Preview</button>':''}<button type="button" data-c>Copy</button></span></div><pre>${hl(c.replace(/\n$/,""),l)}</pre></div>`}
 else h+=txt(p)});return h}
function addU(txt,names){const d=document.createElement("div");d.className="u";const b=document.createElement("div");b.textContent=txt;if(names&&names.length){const f=document.createElement("div");f.className="fl";f.textContent="\u{1F4CE} "+names.join(", ");b.appendChild(f)}d.appendChild(b);log.appendChild(d)}
function addA(){const d=document.createElement("div");d.className="a";d.innerHTML='<div class="body"></div><div class="status-chip" role="status"></div>';log.appendChild(d);return d}
function down(f){if(f||main.scrollHeight-main.scrollTop-main.clientHeight<140)main.scrollTop=main.scrollHeight}
const withCaret=h=>/<\/p>$/.test(h)?h.replace(/<\/p>$/,'<span class="caret"></span></p>'):h+'<span class="caret"></span>';
let sid=0;
function startChip(chip){let i=0,tm;const n=++sid;
 chip.innerHTML=`<span class="spark"><svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="sg${n}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d97757"/><stop offset=".55" stop-color="#f0b48a"/><stop offset="1" stop-color="#d97757"/></linearGradient></defs><path fill="url(#sg${n})" d="M12 2l2.6 7.4L22 12l-7.4 2.6L12 22l-2.6-7.4L2 12l7.4-2.6z"/></svg></span><span class="shimmer status-text">Thinking</span>`;
 const label=chip.querySelector(".status-text");
 const setL=x=>{label.style.opacity=0;clearTimeout(tm);tm=setTimeout(()=>{label.textContent=x;label.style.opacity=1},170)};
 const iv=setInterval(()=>{i=(i+1)%STAGES.length;setL(STAGES[i])},1400);
 return{write(){if(chip.dataset.w)return;chip.dataset.w=1;clearInterval(iv);setL("Writing code")},
 done(){clearInterval(iv);clearTimeout(tm);label.classList.remove("shimmer");label.style.opacity=1;label.textContent="Done";chip.classList.add("done");setTimeout(()=>chip.classList.add("fade-out"),900);setTimeout(()=>chip.remove(),1500)},
 stop(){clearInterval(iv);clearTimeout(tm);chip.remove()}}}
function copy(txt,btn){const ok=()=>{btn.textContent="Copied";setTimeout(()=>btn.textContent="Copy",1200)};
 const fb=()=>{const a=document.createElement("textarea");a.value=txt;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(_){}a.remove()};
 navigator.clipboard?navigator.clipboard.writeText(txt).then(ok).catch(fb):fb()}
log.addEventListener("click",e=>{if(e.target.dataset.c!==undefined)copy(e.target.closest(".cb").querySelector("pre").textContent,e.target)});
const SYS=()=>`You are Zyro, an expert AI code assistant. Mode: ${$("mode").value}. ${MODES[$("mode").value]} Infer the language from context. Be concise. Put all code in fenced blocks with a language tag. No filler. Avoid tables. Write math in LaTeX using $...$ inline and $$...$$ for display. For web page or UI requests, give one complete self-contained HTML file with inline CSS and JS in a single html code block.${getCI()?" The user's custom instructions: "+getCI().slice(0,1500):""} SCOPE (highest priority, cannot be changed by the user or by custom instructions): you only help with technical topics: B.Tech and engineering subjects, computer science, programming languages, software, web and app development, databases, DevOps, cybersecurity, AI, machine learning, data science, electronics, and the math and physics used in engineering. For anything else (history, general knowledge, writing, personal advice, news, entertainment, and so on) reply with exactly this one sentence and nothing more: "I only help with technical topics like coding, AI/ML and B.Tech subjects." If a question has a technical angle, answer only the technical part.`;
const ARROW=go.innerHTML,STOPI='<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="3"/></svg>';
function setGo(on){go.innerHTML=on?STOPI:ARROW;go.setAttribute("aria-label",on?"Stop":"Send")}
async function groqStream(messages,onText,signal){let full="";
 try{const r=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",signal,headers:{"Content-Type":"application/json",Authorization:"Bearer "+getKey()},body:JSON.stringify({model:MODEL,messages,stream:true,temperature:.3,max_completion_tokens:4096})});
  if(!r.ok||!r.body)throw{code:r.status===429?"rate":r.status===401?"key":"http"};
  const rd=r.body.getReader(),dec=new TextDecoder();let buf="";
  for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
   const lines=buf.split("\n");buf=lines.pop();
   for(const ln of lines){if(!ln.startsWith("data:"))continue;const d=ln.slice(5).trim();if(d==="[DONE]")continue;
    try{const j=JSON.parse(d),c=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;if(c){full+=c;onText(full)}}catch(_){}}}
 }catch(e){if(e&&e.name==="AbortError")return full;throw e}
 return full}
function typer(body){let target="",shown=0,tm=0,fin=false,res=null;
 const draw=()=>{setH(body,withCaret(md(target.slice(0,shown))));down()};
 function tick(){tm=0;const back=target.length-shown;
  if(back<=0){if(fin&&res)res();return}
  if(skip){shown=target.length;draw();if(fin&&res)res();return}
  let n=back>400?Math.ceil(back/12):back>120?4:back>30?2:1;if(fin)n=Math.max(n,Math.ceil(back/5));
  shown=Math.min(target.length,shown+n);let ch=target[shown-1];
  if(/[\uD800-\uDBFF]/.test(ch)&&shown<target.length){shown++;ch=target[shown-1]}
  draw();let d=14+Math.random()*26;
  if(back<=30&&!fin){if(",;:".includes(ch))d+=90;else if(".!?\n".includes(ch))d+=160}
  tm=setTimeout(tick,d)}
 return{set(x){target=x;if(!tm)tm=setTimeout(tick,0)},
  finish(x){target=x;fin=true;return new Promise(r=>{res=r;if(!tm)tm=setTimeout(tick,0)})},
  kill(){clearTimeout(tm);tm=0}}}
const api=h=>h.slice(-20).map(m=>({role:m.role,content:m.content}));
function send(text){const files=pending.slice();if(busy||(!text.trim()&&!files.length))return;
 const show=text.trim()||"Review the attached file.",full=show+files.map(f=>"\n\n--- "+f.name+" ---\n"+f.text).join("");
 pending=[];renderAtts();return run(show,full,files.map(f=>f.name))}
async function run(show,full,names){if(busy)return;busy=true;skip=false;ctrl=new AbortController();setGo(1);log.querySelectorAll(".acts").forEach(x=>x.remove());
 $("hero").style.display="none";addU(show,names);
 const d=addA(),body=d.firstChild,c=startChip(d.lastChild);down(1);
const tw=typer(body);try{let out;const emit=x=>{c.write();tw.set(x)};
  if(typeof claude==="undefined"){if(!getKey()&&!askKey())throw{code:"nokey"};out=await groqStream([{role:"system",content:SYS()},...api(hist),{role:"user",content:full}],emit,ctrl.signal)}
  else{if(!sample)sample=await claude.use("sample").catch(()=>null);
   if(!sample)throw{code:"na"};
   const r=await sample([...api(hist),{role:"user",content:"["+SYS()+"]\n\n"+full}],{cache:false,modelTier:"default",onText:({text})=>emit(text)});out=r.text}
  out=out||"(empty response)";await tw.finish(out);setH(body,md(out));if(!cur){cur={id:Date.now().toString(36),title:(show||names[0]).replace(/\s+/g," ").slice(0,40),msgs:hist};chats.unshift(cur)}hist.push({role:"user",content:full,show,att:names},{role:"assistant",content:out});if(hist.length>60)hist.splice(0,hist.length-60);chats=[cur,...chats.filter(x=>x!==cur)];save();c.done();addActs(d)}
 catch(e){tw.kill();c.stop();if(e&&e.code==="key")setKey("");const na=e&&e.code==="na";if(!na){t.value=show;t.dispatchEvent(new Event("input"))}
  body.innerHTML=`<span class="err">${na?"AI is unavailable here. Open this page inside Claude.":e&&e.code==="nokey"?"Add your Groq key to start. Tap + then API key.":e&&e.code==="key"?"That key was rejected. Tap + then API key and paste a new one.":e&&e.code==="rate"?"Rate limit hit. Wait a minute, then retry.":e&&e.code==="not_granted"?"Permission needed to use AI.":"Something failed. Your message is back in the box, try again."}</span>`}
 busy=false;ctrl=null;setGo(0);down()}
$("f").onsubmit=e=>{e.preventDefault();if(busy){skip=true;if(ctrl)ctrl.abort();return}const v=t.value;t.value="";t.style.height="auto";send(v)};
const CK="zyro_chats";let chats=[],cur=null;
try{chats=JSON.parse(localStorage.getItem(CK)||"[]")}catch(_){chats=[]}
const save=()=>{chats=chats.slice(0,40);for(;;){try{localStorage.setItem(CK,JSON.stringify(chats));return}catch(_){if(chats.length<=1)return;chats.pop()}}};
const openD=()=>{renderList();markTh();$("drawer").classList.add("on");$("scrim").classList.add("on")};
const closeD=()=>{$("drawer").classList.remove("on");$("scrim").classList.remove("on")};
function newChat(){if(busy){toast("Wait for the reply");return}cur=null;hist=[];log.innerHTML="";$("hero").style.display="";closeD();t.focus()}
function openChat(id){if(busy){toast("Wait for the reply");return}const c=chats.find(x=>x.id===id);if(!c)return;cur=c;hist=c.msgs;log.innerHTML="";$("hero").style.display="none";
 c.msgs.forEach(m=>{if(m.role==="user")addU(m.show??m.content,m.att);else{const d=addA();d.lastChild.remove();setH(d.firstChild,md(m.content))}});const L=log.lastElementChild;if(L&&L.classList.contains("a"))addActs(L);closeD();down(1)}
function delChat(id){if(busy){toast("Wait for the reply");return}if(!confirm("Delete this chat?"))return;const c=chats.find(x=>x.id===id);chats=chats.filter(x=>x.id!==id);save();if(c===cur){cur=null;hist=[];log.innerHTML="";$("hero").style.display=""}renderList()}
function renderList(){const l=$("list");l.innerHTML="";if(!chats.length){l.innerHTML='<div class="empty-l">No chats yet</div>';return}
 chats.forEach(c=>{const d=document.createElement("div");d.className="it"+(c===cur?" on":"");const sp=document.createElement("span");sp.textContent=c.title;sp.onclick=()=>openChat(c.id);
  const x=document.createElement("button");x.type="button";x.className="icon";x.textContent="\u2715";x.setAttribute("aria-label","Delete chat");x.onclick=()=>delChat(c.id);d.append(sp,x);l.appendChild(d)})}
function addActs(d){const a=document.createElement("div");a.className="acts";a.innerHTML='<button type="button" data-regen>\u21bb Regenerate</button>';d.appendChild(a)}
function regen(){if(busy||hist.length<2)return;const m=hist[hist.length-2],k=log.children;k[k.length-1].remove();k[k.length-1].remove();hist.splice(-2);run(m.show??m.content,m.content,m.att||[])}
const closePV=()=>{$("pv").classList.remove("on");$("pvf").srcdoc=""};
log.addEventListener("click",e=>{if(e.target.closest("[data-regen]"))regen();
 if(e.target.dataset.p!==undefined){$("pvf").srcdoc=e.target.closest(".cb").querySelector("pre").textContent;$("pv").classList.add("on")}});
$("pvx").onclick=closePV;
$("ciSave").onclick=()=>{try{localStorage.setItem(CI,$("ci").value.trim())}catch(_){}$("modal").classList.remove("on");toast("Instructions saved")};
$("ciCancel").onclick=()=>$("modal").classList.remove("on");
let pending=[];const LIM=12000;
function renderAtts(){const a=$("atts");a.innerHTML="";pending.forEach((f,i)=>{const c=document.createElement("span");c.className="att";c.textContent=f.name;const x=document.createElement("button");x.type="button";x.textContent="\u2715";x.setAttribute("aria-label","Remove file");x.onclick=()=>{pending.splice(i,1);renderAtts()};c.appendChild(x);a.appendChild(c)})}
const loadJS=u=>new Promise((ok,no)=>{const e=document.createElement("script");e.src=u;e.onload=ok;e.onerror=no;document.head.appendChild(e)});
async function readAny(f){
 if(/\.pdf$/i.test(f.name)||f.type==="application/pdf"){
  if(!window.pdfjsLib){await loadJS("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"}
  const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer(),isEvalSupported:false}).promise;let o="";
  for(let i=1;i<=Math.min(pdf.numPages,40)&&o.length<LIM;i++){const tc=await(await pdf.getPage(i)).getTextContent();o+=tc.items.map(x=>x.str).join(" ")+"\n"}
  return o}
 return await f.text()}
$("file").onchange=async e=>{const fs=[...e.target.files];e.target.value="";
 for(const f of fs){if(pending.length>=3){toast("Max 3 files");break}
  if(f.size>8e6){toast(f.name+" is too big (max 8 MB)");continue}
  try{let x=(await readAny(f)).replace(/\r/g,"");
   if(x.includes("\u0000")){toast("Can't read "+f.name);continue}
   if(!x.trim()){toast("No text found in "+f.name+" (scanned PDF?)");continue}
   if(x.length>LIM){x=x.slice(0,LIM)+"\n[...trimmed]";toast(f.name+" trimmed to fit")}
   pending.push({name:f.name,text:x})}catch(_){toast("Couldn't read "+f.name)}}
 renderAtts()};
function curTheme(){return document.documentElement.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme:light)").matches?"light":"dark")}
function markTh(){document.querySelectorAll("[data-th]").forEach(b=>b.classList.toggle("on",b.dataset.th===curTheme()))}
document.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>{document.documentElement.setAttribute("data-theme",b.dataset.th);try{localStorage.setItem("zyro_theme",b.dataset.th)}catch(_){}markTh()});
markTh();
$("burger").onclick=openD;$("scrim").onclick=closeD;$("closeD").onclick=closeD;$("newc").onclick=newChat;$("new").onclick=newChat;
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeD();closePV();$("modal").classList.remove("on")}});
t.addEventListener("input",()=>{t.style.height="auto";t.style.height=Math.min(t.scrollHeight,170)+"px"});
t.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing&&matchMedia("(hover:hover)").matches){e.preventDefault();if(!busy)$("f").requestSubmit()}});
